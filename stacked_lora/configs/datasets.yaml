# Per-dataset shape properties used to build the classifier head.
# time_patches: number of time patches produced by the backbone
# num_channels: number of EEG channels
# num_classes: number of target classes
bciciv2a:
  time_patches: 4
  num_channels: 22
  num_classes: 4
  channels: [Fz, FC3, FC1, FCz, FC2, FC4,
             C5, C3, C1, Cz, C2, C4, C6,
             CP3, CP1, CPz, CP2, CP4, P1, Pz, P2, POz]
physionet:
  time_patches: 3
  num_channels: 64
  num_classes: 4
zuo2025:
  time_patches: 4
  num_channels: 30
  num_classes: 2
